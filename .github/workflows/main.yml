name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore release.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=App, OU=Dev, O=Store, L=City, S=State, C=IR"

      - name: ZipAlign and Sign APK
        run: |
          # پیدا کردن مسیر ابزارهای اندروید
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # پیدا کردن فایل APK خام (از هر نامی که دارد)
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          # ساخت پوشه موقت برای فایل‌های جدید
          mkdir -p final_apk
          
          # مرتب‌سازی فایل (ZipAlign)
          $BUILD_TOOLS_DIR/zipalign -v -p 4 $UNSIGNED_APK final_apk/aligned.apk
          
          # امضای رسمی اندروید (V2 Signature) - این مرحله حیاتی است
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:123456 --ks-key-alias myalias --key-pass pass:123456 --out final_apk/AutoRotateApp-Signed.apk final_apk/aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRotateApp-Signed-APK
          path: 'final_apk/AutoRotateApp-Signed.apk'

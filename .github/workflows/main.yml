name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          keytool -genkey -v -keystore release.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=AutoRotate, OU=Dev, O=App, L=City, S=State, C=IR"
          
          $BUILD_TOOLS_DIR/zipalign -v 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:12345678 --ks-key-alias myalias --key-pass pass:12345678 --out AutoRotateApp-Release.apk aligned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRotateApp-Release
          path: AutoRotateApp-Release.apk

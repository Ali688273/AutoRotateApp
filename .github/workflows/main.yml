name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Generate Keystore and Sign APK
        run: |
          # ساخت فایل کلید امضا
          keytool -genkey -v -keystore my-release-key.jks -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=App, OU=Dev, O=Store, L=City, S=State, C=IR"
          
          # پیدا کردن فایل APK و امضا کردن آن
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore my-release-key.jks -storepass 123456 -keypass 123456 $APK_FILE myalias
          
          # تغییر نام برای مشخص شدن
          mv $APK_FILE app/build/outputs/apk/release/AutoRotateApp-Signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoRotateApp-APK
          path: 'app/build/outputs/apk/release/AutoRotateApp-Signed.apk'

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fullrotation'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.fullrotation"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('RELEASE_KEYSTORE_PATH')
            storeFile file(keystorePath ?: "$projectDir/release-key.jks")
            storePassword System.getenv('RELEASE_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('RELEASE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('RELEASE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.3'
    implementation 'com.adivery:sdk:4.9.0'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
}
